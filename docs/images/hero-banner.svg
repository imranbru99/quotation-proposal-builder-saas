<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bg)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="100" r="140" fill="#2563eb" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="180" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="650" cy="200" r="120" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />
  <path d="M 200,0 L 200,420 M 400,0 L 400,420 M 600,0 L 600,420 M 800,0 L 800,420 M 1000,0 L 1000,420" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />

  <!-- Left Content Area -->
  <g transform="translate(70, 70)">
    <!-- Top Pill -->
    <rect x="0" y="0" width="340" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="16" cy="16" r="6" fill="#10b981" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.5">ENTERPRISE SAAS • LARAVEL 12 &amp; FILAMENT 5</text>

    <!-- Main Headline -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Quotation &amp; Proposal
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1">
      Builder Ecosystem
    </text>

    <!-- Subtitle / Action Tagline -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="1">
      SEND  •  SIGN  •  CONVERT TO INVOICE
    </text>
    <text x="0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Multi-Tenant Architecture • Tamper-Evident SHA-256 e-Signatures • 1-Click Conversion • Unicode PDF
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="55" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">100% Modular</text>

      <!-- Badge 2 -->
      <rect x="120" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="177" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Zero Data Loss</text>

      <!-- Badge 3 -->
      <rect x="245" y="0" width="120" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="305" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Multi-AI Provider</text>

      <!-- Badge 4 -->
      <rect x="375" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="437" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">REST API v1</text>
    </g>
  </g>

  <!-- Right Floating Interactive Mockup Cards -->
  <g transform="translate(710, 50)" filter="url(#shadow)">
    <!-- Main Card 1: Quotation Converted -->
    <rect x="0" y="0" width="420" height="180" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Card Header -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#2563eb" />
    <text x="34" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff">Q</text>
    <text x="64" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Quotation #QT-2026-0001</text>
    <text x="64" y="48" font-family="sans-serif" font-size="11" fill="#94a3b8">Client: Acme Global Tech • $4,400.00 USD</text>

    <!-- Status Badges -->
    <rect x="310" y="20" width="90" height="24" rx="12" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="355" y="36" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">✓ ACCEPTED</text>

    <!-- Conversion Arrow Section -->
    <rect x="16" y="70" width="388" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="36" cy="91" r="12" fill="#3b82f6" />
    <text x="36" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff">⇄</text>
    <text x="60" y="88" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">1-Click Auto Conversion Executed</text>
    <text x="60" y="103" font-family="sans-serif" font-size="10" fill="#64748b">Cloned snapshot into Invoice #INV-2026-0001 (Zero Re-typing)</text>

    <!-- Checksum & Legal Audit -->
    <rect x="16" y="124" width="388" height="40" rx="8" fill="#134e4a" fill-opacity="0.3" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3" />
    <text x="30" y="141" font-family="sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">🔒 Legal e-Signature Locked (SHA-256):</text>
    <text x="30" y="155" font-family="monospace" font-size="9" fill="#99f6e4">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>
  </g>

  <!-- Secondary Floating Card: ROI & Time Saved -->
  <g transform="translate(740, 245)" filter="url(#shadow)">
    <rect x="0" y="0" width="390" height="135" rx="14" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5" />
    
    <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="800" fill="#a5b4fc" letter-spacing="0.5">BUSINESS VELOCITY &amp; ROI</text>
    
    <!-- Metric 1 -->
    <g transform="translate(20, 48)">
      <text x="0" y="24" font-family="sans-serif" font-size="28" font-weight="900" fill="#38bdf8">&lt; 5s</text>
      <text x="0" y="44" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Quote to Invoice</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(145, 48)">
      <text x="0" y="24" font-family="sans-serif" font-size="28" font-weight="900" fill="#34d399">92%</text>
      <text x="0" y="44" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Faster Approvals</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(270, 48)">
      <text x="0" y="24" font-family="sans-serif" font-size="28" font-weight="900" fill="#f43f5e">20+ hrs</text>
      <text x="0" y="44" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Saved Weekly</text>
    </g>
  </g>
</svg>
