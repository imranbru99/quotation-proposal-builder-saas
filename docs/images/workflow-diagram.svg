<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="280" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title -->
  <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#38bdf8" letter-spacing="1">
    END-TO-END TRANSACTION PIPELINE
  </text>
  <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#ffffff">
    How Deals Turn into Settled Cash in Under 5 Minutes
  </text>

  <!-- Pipeline Steps -->
  <g transform="translate(40, 95)">
    <!-- Connecting Horizontal Glow Line -->
    <line x1="80" y1="65" x2="940" y2="65" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" />

    <!-- Step 1: AI Proposal / Quote -->
    <g transform="translate(0, 0)" filter="url(#shadowLight)">
      <rect x="0" y="0" width="185" height="135" rx="12" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" />
      <circle cx="92" cy="35" r="20" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
      <text x="92" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#60a5fa">1</text>
      <text x="92" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">AI Quote &amp; Proposal</text>
      <text x="92" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">Instant Line Items &amp; Tax</text>
      <rect x="50" y="106" width="85" height="18" rx="9" fill="#172554" />
      <text x="92" y="119" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#93c5fd">⏱ 3 Mins</text>
    </g>

    <!-- Step 2: Tokenized Review Portal -->
    <g transform="translate(210, 0)" filter="url(#shadowLight)">
      <rect x="0" y="0" width="185" height="135" rx="12" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="92" cy="35" r="20" fill="#312e81" stroke="#6366f1" stroke-width="2" />
      <text x="92" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#a5b4fc">2</text>
      <text x="92" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">Client Portal Link</text>
      <text x="92" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">No Sign-up Friction</text>
      <rect x="50" y="106" width="85" height="18" rx="9" fill="#1e1b4b" />
      <text x="92" y="119" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#c7d2fe">🔗 1-Click Send</text>
    </g>

    <!-- Step 3: Legal e-Signature -->
    <g transform="translate(420, 0)" filter="url(#shadowLight)">
      <rect x="0" y="0" width="185" height="135" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" />
      <circle cx="92" cy="35" r="20" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="92" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#34d399">3</text>
      <text x="92" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">Legal e-Signature</text>
      <text x="92" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">SHA-256 Audit Trail</text>
      <rect x="50" y="106" width="85" height="18" rx="9" fill="#065f46" />
      <text x="92" y="119" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#6ee7b7">🔒 Legally Bound</text>
    </g>

    <!-- Step 4: 1-Click Conversion -->
    <g transform="translate(630, 0)" filter="url(#shadowLight)">
      <rect x="0" y="0" width="185" height="135" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="92" cy="35" r="20" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
      <text x="92" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#fbbf24">4</text>
      <text x="92" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">Convert to Invoice</text>
      <text x="92" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">Zero Re-typing or Errors</text>
      <rect x="50" y="106" width="85" height="18" rx="9" fill="#451a03" />
      <text x="92" y="119" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fde68a">⚡ &lt; 5 Seconds</text>
    </g>

    <!-- Step 5: Settled Payments & Receipts -->
    <g transform="translate(840, 0)" filter="url(#shadowLight)">
      <rect x="0" y="0" width="185" height="135" rx="12" fill="url(#cardBg)" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="92" cy="35" r="20" fill="#831843" stroke="#ec4899" stroke-width="2" />
      <text x="92" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#f472b6">5</text>
      <text x="92" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">Payment &amp; Receipt</text>
      <text x="92" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">Unicode PDF Generated</text>
      <rect x="50" y="106" width="85" height="18" rx="9" fill="#500724" />
      <text x="92" y="119" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fbcfe8">💰 Paid In Full</text>
    </g>
  </g>
</svg>

