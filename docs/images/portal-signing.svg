    <text x="350" y="275" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">$2,200.00</text>
    
    <line x1="24" y1="295" x2="396" y2="295" stroke="#475569" stroke-width="1" />
    <text x="24" y="325" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff">Grand Total Payable:</text>
