    <text x="24" y="250" font-family="sans-serif" font-size="12" fill="#ffffff">1. Initial Deposit (50%)</text>
    <text x="350" y="250" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">$2,200.00</text>
    
